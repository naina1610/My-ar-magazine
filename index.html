<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>AR Magazine Test</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    .a-canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    maxTrack: 2;
    uiScanning: true;
    uiLoading: true;
  "
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="colorManagement: true; physicallyCorrectLights: true">

  <a-assets>

    <video
      id="video1"
      src="https://cdn.glitch.global/aac91519-95ff-4996-8909-e5c41f3cfff9/mov_bbb.mp4"
      preload="auto"
      loop
      playsinline
      crossorigin="anonymous">
    </video>

    <video
      id="video2"
      src="https://cdn.glitch.global/aac91519-95ff-4996-8909-e5c41f3cfff9/mov_bbb.mp4"
      preload="auto"
      loop
      playsinline
      crossorigin="anonymous">
    </video>

  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <!-- TARGET 1 -->
  <a-entity
    mindar-image-target="targetIndex: 0"
    id="target1">

    <a-video
      src="#video1"
      position="0 0 0"
      width="1"
      height="0.5625">
    </a-video>

  </a-entity>

  <!-- TARGET 2 -->
  <a-entity
    mindar-image-target="targetIndex: 1"
    id="target2">

    <a-video
      src="#video2"
      position="0 0 0"
      width="1"
      height="0.5625">
    </a-video>

  </a-entity>

</a-scene>

<script>

  const video1 = document.querySelector("#video1");
  const video2 = document.querySelector("#video2");

  const target1 = document.querySelector("#target1");
  const target2 = document.querySelector("#target2");

  target1.addEventListener("targetFound", () => {
    video1.currentTime = 0;
    video1.play().catch(error => {
      console.log("Video 1:", error);
    });
  });

  target1.addEventListener("targetLost", () => {
    video1.pause();
  });

  target2.addEventListener("targetFound", () => {
    video2.currentTime = 0;
    video2.play().catch(error => {
      console.log("Video 2:", error);
    });
  });

  target2.addEventListener("targetLost", () => {
    video2.pause();
  });

</script>

</body>
</html>
